<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — Shree Parameswari Enterprises</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eff6ff 0%,#fff 50%,#dbeafe 100%)}
    .card{background:white;border-radius:24px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(37,99,235,0.12);border:1px solid #e2e8f0;text-align:center}
    .logo-wrap{width:64px;height:64px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 24px rgba(37,99,235,0.3)}
    .logo-wrap svg{width:32px;height:32px}
    h1{font-size:22px;color:#0f172a;margin-bottom:6px}
    p{font-size:14px;color:#64748b;margin-bottom:32px}
    .pin-label{display:block;text-align:left;font-size:13px;font-weight:600;color:#334155;margin-bottom:8px}
    .pin-input{display:flex;gap:10px;justify-content:center;margin-bottom:24px}
    .pin-input input{
      width:52px;height:60px;text-align:center;font-size:24px;font-weight:700;
      border:2px solid #e2e8f0;border-radius:14px;outline:none;
      transition:all 0.2s;color:#1e293b;background:#f8fafc;
    }
    .pin-input input:focus{border-color:#2563eb;background:white;box-shadow:0 0 0 4px rgba(37,99,235,0.1)}
    .pin-input input.filled{border-color:#93c5fd;background:#eff6ff}
    .btn-login{
      width:100%;padding:15px;background:#2563eb;color:white;
      font-size:16px;font-weight:600;border:none;border-radius:14px;
      cursor:pointer;transition:all 0.2s;
      box-shadow:0 4px 16px rgba(37,99,235,0.3)
    }
    .btn-login:hover{background:#1d4ed8;transform:translateY(-1px)}
    .btn-login:disabled{background:#93c5fd;cursor:not-allowed;transform:none}
    .error{display:none;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
    .error.show{display:block}
    .back-link{display:block;margin-top:20px;font-size:13px;color:#64748b}
    .back-link a{color:#2563eb;text-decoration:none}
    .back-link a:hover{text-decoration:underline}
    .shake{animation:shake 0.4s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  </style>
</head>
<body>
  <div class="card" id="loginCard">
    <div class="logo-wrap">
      <svg viewBox="0 0 32 32" fill="none">
        <rect x="2" y="6" width="28" height="5" rx="2.5" fill="white"/>
        <rect x="2" y="14" width="28" height="5" rx="2.5" fill="white" opacity=".7"/>
        <rect x="2" y="22" width="18" height="5" rx="2.5" fill="white" opacity=".4"/>
      </svg>
    </div>
    <h1>Admin Panel</h1>
    <p>Shree Parameswari Enterprises<br/>Enter your 6-digit PIN to continue</p>

    <div class="error" id="errorMsg">Wrong PIN. Please try again.</div>

    <label class="pin-label">Enter PIN</label>
    <div class="pin-input" id="pinBoxes">
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="p0"/>
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="p1"/>
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="p2"/>
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="p3"/>
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="p4"/>
      <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="p5"/>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()" disabled>Login</button>
    <div class="back-link">← <a href="/">Back to website</a></div>
  </div>

  <script>
    const inputs = document.querySelectorAll('.pin-input input');
    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.classList.toggle('filled', inp.value !== '');
        if (inp.value && i < inputs.length - 1) inputs[i+1].focus();
        checkFull();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
        if (e.key === 'Enter') doLogin();
      });
    });
    inputs[0].focus();

    function checkFull() {
      const full = [...inputs].every(i => i.value.length === 1);
      document.getElementById('loginBtn').disabled = !full;
    }

    async function doLogin() {
      const pin = [...inputs].map(i => i.value).join('');
      if (pin.length < 6) return;
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Checking…';
      const r = await fetch('/api/admin/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ pin })
      });
      const d = await r.json();
      if (d.success) {
        btn.textContent = '✅ Success! Redirecting…';
        window.location.href = '/admin/dashboard';
      } else {
        const err = document.getElementById('errorMsg');
        err.classList.add('show');
        document.getElementById('loginCard').classList.add('shake');
        setTimeout(() => document.getElementById('loginCard').classList.remove('shake'), 400);
        inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
        inputs[0].focus();
        btn.textContent = 'Login'; btn.disabled = true;
      }
    }
  </script>
</body>
</html>
